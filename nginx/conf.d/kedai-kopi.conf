# =============================================================
# Kedai Kopi ASMDS — Nginx (container)
# - Sajikan file statis dari /usr/share/nginx/html
# - Proxy /api/ ke service `app` (Node/Express) port 3000
# - Terminasi TLS dgn sertifikat Let's Encrypt yang di-mount dari host
# GANTI <CERT_DIR> sesuai hasil `ls /etc/letsencrypt/live/`
# (biasanya: kedai-kopi-asmds.store)
# =============================================================

# HTTP: tangani ACME challenge (renewal certbot webroot) + redirect ke HTTPS
server {
    listen 80;
    server_name kedai-kopi-asmds.store www.kedai-kopi-asmds.store;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name kedai-kopi-asmds.store www.kedai-kopi-asmds.store;

    ssl_certificate     /etc/letsencrypt/live/<CERT_DIR>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<CERT_DIR>/privkey.pem;

    root  /usr/share/nginx/html;
    index index.html;

    # Keamanan dasar
    server_tokens off;
    add_header X-Frame-Options        "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy        "strict-origin-when-cross-origin";

    # File statis dilayani langsung oleh Nginx
    location / {
        try_files $uri $uri/ =404;
    }

    # /api/* diteruskan ke container app (Node.js)
    location /api/ {
        proxy_pass         http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
