# =============================================================
# Kedai Kopi ASMDS — orkestrasi container (keadaan FINAL: 80/443)
# Rahasia dibaca dari file .env di folder yang sama (gitignored).
# Lihat .env.docker.example untuk template.
# Untuk uji pra-cutover: tambahkan `-f docker-compose.test.yml`.
# =============================================================
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [kopinet]
    # Catatan: port 5432 sengaja TIDAK di-publish (hanya internal jaringan compose)
    # agar tak bentrok dgn PostgreSQL host & lebih aman. Restore via `docker compose exec`.

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      PORT: 3000
      NODE_ENV: production
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN}
      # Default false: jangan sentuh data hasil restore. true hanya utk DB kosong.
      RUN_DB_PUSH: ${RUN_DB_PUSH:-false}
      RUN_SEED: ${RUN_SEED:-false}
    depends_on:
      db:
        condition: service_healthy
    networks: [kopinet]

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./nginx/certbot-webroot:/var/www/certbot
    networks: [kopinet]

volumes:
  pgdata: {}

networks:
  kopinet: {}
