<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pencarian Menu - KEDAI KOPI ASMDS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px;
    }
    .logo {
      font-size: 1.5rem;
      font-weight: bold;
      color: #c8a96e;
      margin-bottom: 10px;
      letter-spacing: 2px;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 30px;
      color: #fff;
    }
    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
      width: 100%;
      max-width: 500px;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #c8a96e;
      background: #16213e;
      color: #fff;
      font-size: 1rem;
    }
    button {
      padding: 12px 24px;
      background: #c8a96e;
      color: #1a1a2e;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
    }
    button:hover { background: #e0c080; }
    .result {
      background: #16213e;
      border: 1px solid #c8a96e33;
      border-radius: 12px;
      padding: 20px 30px;
      max-width: 500px;
      width: 100%;
      font-size: 1rem;
      color: #ccc;
      min-height: 60px;
    }
    .result span { color: #c8a96e; font-weight: bold; }
    .warning {
      margin-top: 40px;
      background: #ff000022;
      border: 1px solid #ff4444;
      border-radius: 8px;
      padding: 12px 20px;
      font-size: 0.85rem;
      color: #ff9999;
      max-width: 500px;
      width: 100%;
      text-align: center;
    }
    nav {
      margin-bottom: 40px;
    }
    nav a {
      color: #c8a96e;
      text-decoration: none;
      margin: 0 10px;
      font-size: 0.95rem;
    }
    nav a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="logo">☕ KEDAI KOPI ASMDS</div>
  <nav>
    <a href="index.html">Home</a>
    <a href="#menu">Menu</a>
    <a href="search.html">Pencarian</a>
  </nav>

  <h1>Cari Menu Favorit</h1>

  <div class="search-box">
    <input type="text" id="query" placeholder="Ketik nama menu..." />
    <button onclick="cariMenu()">Cari</button>
  </div>

  <div class="result" id="hasil">
    Hasil pencarian akan muncul di sini.
  </div>

  <div class="warning">
    ⚠️ Halaman ini adalah simulasi demonstrasi keamanan (XSS Vulnerability Demo).
  </div>

  <script>
    // ❌ VULNERABLE: Input langsung dimasukkan ke innerHTML tanpa sanitasi
    function cariMenu() {
      var query = document.getElementById('query').value;
      document.getElementById('hasil').innerHTML =
        'Hasil pencarian untuk: <span>' + query + '</span>';
    }

    // Ambil parameter dari URL jika ada (?q=...)
    // ❌ VULNERABLE: Reflected XSS via URL parameter
    var params = new URLSearchParams(window.location.search);
    var q = params.get('q');
    if (q) {
      document.getElementById('query').value = q;
      document.getElementById('hasil').innerHTML =
        'Hasil pencarian untuk: <span>' + q + '</span>';
    }
  </script>

</body>
</html>
